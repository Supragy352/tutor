name: CI

on:
  push:
  pull_request:

env:
  TUTOR_LLM: off

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # the RL course's reference solution trains networks with numpy
      - run: python -m pip install numpy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Verify docs structure
        shell: python
        run: |
          from pathlib import Path
          for name in ("index.html", "dashboard.html"):
              p = Path("docs") / name
              text = p.read_text(encoding="utf-8")
              assert text.lstrip().lower().startswith("<!doctype html>"), f"{p} missing doctype"
              assert 'charset="utf-8"' in text.lower(), f"{p} missing utf-8 charset"
              assert 'name="viewport"' in text.lower(), f"{p} missing viewport meta"
          print("Docs verification passed.")
