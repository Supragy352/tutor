<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tutor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f6f5f2; --panel: #fff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e3e1db;
  --accent: #2f6f4f; --accent-ink: #fff; --fail: #b3261e; --code: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a988f; --line: #2e2d2a;
    --accent: #5fb38a; --accent-ink: #0d1f16; --fail: #f2847b; --code: #272623;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
.bar { flex: 1; max-width: 320px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); transition: width .4s; }
#count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.wrap { display: grid; grid-template-columns: 270px minmax(0, 1fr); max-width: 1200px; margin: 0 auto; }
nav { padding: 20px 12px; border-right: 1px solid var(--line); min-height: calc(100vh - 53px); }
nav button { all: unset; box-sizing: border-box; display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--ink); }
nav button:hover:not(:disabled), nav button[aria-current="true"] { background: var(--code); }
nav button[aria-current="true"] { font-weight: 600; }
nav button:disabled { color: var(--muted); cursor: default; }
nav button:focus-visible, .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; border: 1.5px solid var(--line); color: var(--muted); }
.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.current .dot { border-color: var(--accent); color: var(--accent); }
main { padding: 28px 40px 64px; }
.kicker { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
main h2 { margin: 4px 0 16px; font-size: 26px; line-height: 1.25; }
.md { max-width: 72ch; }
.md code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
.md pre { background: var(--code); padding: 10px 12px; border-radius: 6px; }
.md pre code { background: none; padding: 0; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 28px 0 8px; padding-top: 20px; border-top: 1px solid var(--line); }
.actions button { font: inherit; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.actions .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.actions button:disabled { opacity: .6; cursor: progress; }
.note { color: var(--muted); font-size: 13px; }
#error { color: var(--fail); min-height: 1em; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-top: 16px; }
.card h3 { margin: 0 0 10px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.badge { font-size: 12px; padding: 1px 9px; border-radius: 10px; font-weight: 600; }
.badge.ok { background: var(--accent); color: var(--accent-ink); }
.badge.bad { background: var(--fail); color: var(--panel); }
pre { margin: 0; overflow-x: auto; font: 13px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
.line-pass { color: var(--muted); }
.line-fail { color: var(--fail); font-weight: 600; }
@media (max-width: 760px) {
  header { padding: 12px 16px; }
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav { min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; padding: 10px 16px; }
  nav button { width: auto; white-space: nowrap; }
  main { padding: 20px 16px 48px; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">tutor</h1>
  <div class="bar" role="progressbar" aria-label="Course progress"><div id="progress" style="width:0"></div></div>
  <span id="count"></span>
</header>
<div class="wrap">
  <nav id="stages" aria-label="Stages"></nav>
  <main>
    <div class="kicker" id="kicker"></div>
    <h2 id="stage-name">Loading…</h2>
    <div id="instructions" class="md"></div>
    <div class="actions" id="actions">
      <button class="primary" id="run">Run tests</button>
      <button id="hint">Ask Claude</button>
      <span class="note" id="note"></span>
    </div>
    <div id="error" role="alert"></div>
    <section id="results" aria-live="polite"></section>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
let state = null, raw = "", selected = null, busy = false, asked = null;

// Course text and model output are rendered as sanitized markdown; plain text if the CDN is unreachable.
function setMd(el, text) {
  if (window.marked && window.DOMPurify) el.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
  else { el.textContent = text || ""; el.style.whiteSpace = "pre-wrap"; }
}

async function call(method, path) {
  const r = await fetch(path, { method, headers: { "X-Tutor": "1" } });
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

// Polling picks up runs triggered by the git hook in another terminal.
async function refresh() {
  if (busy) return;
  try { apply(await call("GET", "/api/state")); $("error").textContent = ""; }
  catch (e) { $("error").textContent = "Can't reach `tutor serve`: " + e.message; }
}

function apply(s) {
  const json = JSON.stringify(s);
  if (json === raw) return;
  const advanced = state && s.stage !== state.stage;
  state = s; raw = json;
  if (selected === null || advanced || selected > s.stage) selected = Math.min(s.stage, s.stages.length - 1);
  render();
}

function render() {
  const s = state, n = s.stages.length, finished = s.stage >= n, st = s.stages[selected];
  document.title = s.title + " · tutor";
  $("title").textContent = s.title;
  $("progress").style.width = (100 * Math.min(s.stage, n) / n) + "%";
  $("count").textContent = finished ? "Complete" : `Stage ${s.stage + 1} of ${n}`;

  $("stages").replaceChildren(...s.stages.map((x, i) => {
    const b = document.createElement("button");
    b.className = i < s.stage ? "done" : i === s.stage ? "current" : "locked";
    b.disabled = i > s.stage;
    b.setAttribute("aria-current", i === selected);
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.textContent = i < s.stage ? "✓" : i + 1;
    const label = document.createElement("span");
    label.textContent = x.name;
    b.append(dot, label);
    b.onclick = () => { selected = i; render(); };
    return b;
  }));

  $("kicker").textContent = finished ? "Course complete" : `Stage ${selected + 1} · ${selected < s.stage ? "passed" : "current"}`;
  $("stage-name").textContent = st.name;
  setMd($("instructions"), st.instructions);
  $("actions").hidden = finished || selected !== s.stage;
  const hookNote = "or just commit: the git hook runs the same check";
  $("note").textContent = s.fails ? `${s.fails} of ${s.escalate_after} failed runs before Claude steps in · ${hookNote}` : hookNote;
  renderResults(s.last);
}

function card(title, badge) {
  const c = document.createElement("div");
  c.className = "card";
  const h = document.createElement("h3");
  h.textContent = title;
  if (badge) {
    const b = document.createElement("span");
    b.className = "badge " + badge[0];
    b.textContent = badge[1];
    h.append(b);
  }
  c.append(h);
  return c;
}

function mdCard(title, text) {
  const c = card(title), d = document.createElement("div");
  d.className = "md";
  setMd(d, text);
  c.append(d);
  return c;
}

function renderResults(last) {
  const out = $("results");
  out.replaceChildren();
  if (asked && asked.stage === state.stage) out.append(mdCard("Claude Code hint", asked.text));
  if (!last) return;
  const c = card(`Last run · stage ${last.stage + 1}`, last.ok ? ["ok", "passed"] : ["bad", "failed"]);
  const pre = document.createElement("pre");
  for (const line of last.report.trimEnd().split("\n")) {
    const span = document.createElement("span");
    span.className = /^\s*(FAIL|BUILD)/.test(line) ? "line-fail" : /^\s*pass/.test(line) ? "line-pass" : "";
    span.textContent = line + "\n";
    pre.append(span);
  }
  c.append(pre);
  out.append(c);
  if (last.review) out.append(mdCard("Reviewer · local model", last.review));
  if (last.hint) out.append(mdCard("Claude Code · stepped in after repeated failures", last.hint));
}

async function act(button, path, label) {
  const buttons = document.querySelectorAll(".actions button"), old = button.textContent;
  busy = true;
  button.textContent = label;
  buttons.forEach(b => b.disabled = true);
  $("error").textContent = "";
  try {
    const r = await call("POST", path);
    if (path === "/api/test") { raw = ""; apply(r); }
    else { asked = { stage: state.stage, text: r.hint }; render(); }
  } catch (e) {
    $("error").textContent = e.message;
  } finally {
    busy = false;
    button.textContent = old;
    buttons.forEach(b => b.disabled = false);
  }
}

$("run").onclick = () => act($("run"), "/api/test", "Running…");
$("hint").onclick = () => act($("hint"), "/api/hint", "Asking Claude…");
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
